<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Combiner</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --panel-color: #18222d;
            --accent-color: #2b5278;
            --text-color: #f5f5f5;
            --text-secondary: #8b9bb4;
            --border-color: #222e3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
        
        /* Мобильное боковое меню / навигация */
        sidebar { width: 80px; background: var(--panel-color); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px; }
        .nav-btn { background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; padding: 10px; border-radius: 12px; transition: 0.2s; }
        .nav-btn:hover, .nav-btn.active { background: var(--accent-color); color: #fff; }

        /* Основная рабочая область */
        .main-container { flex: 1; display: flex; flex-direction: column; height: 100%; overflow-y: auto; }
        header { padding: 15px 20px; background: var(--panel-color); border-bottom: 1px solid var(--border-color); font-size: 18px; font-weight: 600; }
        
        .content { padding: 20px; display: flex; flex-direction: column; gap: 20px; max-width: 800px; width: 100%; margin: 0 auto; }
        
        /* Карточки модулей */
        .card { background: var(--panel-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .card h2 { font-size: 16px; color: var(--text-color); margin-bottom: 5px; }
        
        label { font-size: 13px; color: var(--text-secondary); }
        input, select, textarea { width: 100%; padding: 12px; background: #131c27; border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: var(--accent-color); }
        
        button.action-btn { background: #3390ec; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button.action-btn:hover { background: #2376be; }

        /* Адаптивность для телефона */
        @media (max-width: 600px) {
            body { flex-direction: column-reverse; }
            sidebar { width: 100%; height: 60px; flex-direction: row; justify-content: space-around; padding-top: 0; border-right: none; border-top: 1px solid var(--border-color); }
            .main-container { height: calc(100vh - 60px); }
        }
    </style>
</head>
<body>

    <!-- Навигация (в стиле Telegram) -->
    <sidebar>
        <button class="nav-btn active" title="Аккаунты">👥</button>
        <button class="nav-btn" title="Парсер">🔍</button>
        <button class="nav-btn" title="Инвайтер">➕</button>
        <button class="nav-btn" title="Спамер">💬</button>
    </sidebar>

    <!-- Главная панель управления -->
    <div class="main-container">
        <header>Telegram Combiner — Панель управления</header>
        
        <div class="content">
            <!-- Блок настройки парсера -->
            <div class="card">
                <h2>🔍 Универсальный парсер</h2>
                <label>Ссылка или username чата</label>
                <input type="text" placeholder="https://t.me/chat_name">
                <label>Лимит сообщений (без повторов)</label>
                <input type="number" value="5000">
                <button class="action-btn">Запустить сбор</button>
            </div>

            <!-- Блок инвайтера -->
            <div class="card">
                <h2>➕ Инвайтер</h2>
                <label>Лимит на аккаунт</label>
                <input type="number" value="15">
                <label>Задержка (сек)</label>
                <input type="text" value="10 - 25">
                <button class="action-btn">Запустить инвайт</button>
            </div>
        </div>
    </div>

</body>
</html>
