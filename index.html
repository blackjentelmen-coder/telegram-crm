<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram CRM Комбайн</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-primary { background: #3b82f6; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-success { background: #10b981; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        h3 { margin-top: 0; font-size: 16px; color: #38bdf8; }
        .account-item { background: #0f172a; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка с инфо о клиенте -->
        <div class="card header">
            <div>
                <div style="font-size: 13px; color: #94a3b8;">Клиент</div>
                <div style="font-weight: bold; font-size: 16px;">Панель управления</div>
            </div>
            <a href="/logout-client" style="text-decoration: none;"><button class="btn-danger">Выйти</button></a>
        </div>

        <!-- Управление аккаунтами -->
        <div class="card">
            <h3>Telegram Аккаунты</h3>
            <form action="/cabinet/add-account" method="POST">
                <input type="text" name="phone" placeholder="+380..." required>
                <button type="submit" class="btn-success">Запросить код (SMS)</button>
            </form>
            <div style="text-align: center; margin: 10px 0; color: #64748b; font-size: 13px;">или</div>
            <a href="/cabinet/start-qr"><button class="btn-primary" style="background: #8b5cf6; margin-top:0;">Вход по QR-коду</button></a>
        </div>

        <!-- Панель задач (Инвайтер, Спамер, Парсер) -->
        <div class="card">
            <h3>Запуск задач</h3>
            <form action="/cabinet/run-task" method="POST">
                <label style="font-size: 12px; color: #94a3b8;">Выберите инструмент:</label>
                <select name="task_type">
                    <option value="Парсер">🔍 Парсер (сбор чата / проверка)</option>
                    <option value="Инвайтер">👥 Инвайтер (добавление в чат)</option>
                    <option value="Спамер / Рассылка">🚀 Спамер / Рассылка (отправка сообщений)</option>
                </select>

                <label style="font-size: 12px; color: #94a3b8; margin-top: 8px; display: block;">Цель (ссылка / чат / текст):</label>
                <textarea name="target_link" rows="3" placeholder="https://t.me/... или текст для рассылки" required></textarea>

                <button type="submit" class="btn-primary">Запустить задачу</button>
            </form>
        </div>

        <!-- История / Результаты -->
        <div class="card">
            <h3>История задач</h3>
            <p style="color: #64748b; font-size: 13px; margin: 0;">Здесь будут отображаться результаты выполнения твоих задач.</p>
        </div>
    </div>
</body>
</html>
