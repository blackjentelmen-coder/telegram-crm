<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOSTCORE | Личный кабинет</title>
    <style>
        :root {
            --bg-main: #060609;
            --panel-bg: #110b0e;
            --panel-border: #4a121d;
            --neon-red: #ff1e42;
            --neon-red-soft: rgba(255, 30, 66, 0.28);
            --green-btn: #0e241b;
            --green-border: #14532d;
            --green-text: #22c55e;
            --text-main: #f5f5f7;
            --text-muted: #9e969b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            background: radial-gradient(circle at top, #18070c 0%, var(--bg-main) 65%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .shell {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
        }
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px 14px 4px;
            gap: 10px;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .burger-btn {
            width: 38px;
            height: 38px;
            background: #14090d;
            border: 1.5px solid var(--panel-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 0;
            flex: 0 0 auto;
        }
        .burger-btn span {
            width: 18px;
            height: 2px;
            background: var(--text-main);
            border-radius: 2px;
        }
        .logo-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--neon-red);
            text-shadow: 0 0 12px var(--neon-red-soft);
            text-transform: uppercase;
        }
        .exit-link {
            padding: 7px 12px;
            border-radius: 8px;
            background: #151216;
            border: 1px solid #2b2228;
            color: var(--text-main);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .drawer-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: 80;
            display: none;
        }
        .drawer-mask.open { display: block; }
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 275px;
            max-width: 82vw;
            height: 100vh;
            background: #0d080b;
            border-right: 1.5px solid var(--panel-border);
            z-index: 90;
            padding: 16px;
            transform: translateX(-100%);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        .drawer.open { transform: translateX(0); }
        .drawer-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--panel-border);
        }
        .drawer-close {
            background: #1a0d12;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            border-radius: 6px;
            width: 28px;
            height: 28px;
            cursor: pointer;
        }
        .drawer-cap {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-top: 8px;
        }
        .drawer-btn {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border-radius: 8px;
            background: #160c10;
            border: 1px solid #351119;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        .drawer-btn.active, .drawer-btn:hover {
            border-color: var(--neon-red);
            background: rgba(255, 30, 66, 0.14);
        }
        .frame-card {
            background: var(--panel-bg);
            border: 1.5px solid var(--panel-border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: inset 0 0 18px rgba(255, 30, 66, 0.06);
        }
        .frame-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 12px;
        }
        .field-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 10px 0 6px 0;
        }
        .field-box, .area-box, .select-box {
            width: 100%;
            padding: 10px 12px;
            background: #14090d;
            border: 1px solid #45121c;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }
        .field-box:focus, .area-box:focus, .select-box:focus {
            border-color: var(--neon-red);
            box-shadow: 0 0 8px var(--neon-red-soft);
        }
        .area-box {
            min-height: 76px;
            resize: vertical;
            font-family: inherit;
        }
        .key-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #090507;
            border: 1px solid var(--neon-red);
            border-radius: 8px;
            padding: 10px 12px;
        }
        .key-val {
            font-family: monospace;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #fff;
            user-select: all;
        }
        .copy-btn {
            padding: 6px 10px;
            border-radius: 6px;
            background: #1c0c12;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        .stat-box {
            background: #14090d;
            border: 1px solid #351119;
            border-radius: 8px;
            padding: 10px;
        }
        .stat-num {
            font-size: 16px;
            font-weight: 800;
            color: var(--neon-red);
        }
        .stat-cap {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 2px;
        }
        .btn-red {
            width: 100%;
            padding: 11px 14px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #c71230, var(--neon-red));
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 12px var(--neon-red-soft);
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .btn-green {
            width: 100%;
            padding: 11px 14px;
            margin-top: 8px;
            border: 1px solid var(--green-border);
            border-radius: 8px;
            background: var(--green-btn);
            color: var(--green-text);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .or-divider {
            text-align: center;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 12px 0 4px 0;
        }
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .mode-btn {
            padding: 10px 8px;
            border-radius: 8px;
            background: #140a0e;
            border: 1px solid #351119;
            color: var(--text-main);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            text-align: center;
        }
        .mode-btn.active {
            border-color: var(--neon-red);
            background: rgba(255, 30, 66, 0.14);
        }
        .two-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .toast {
            background: rgba(255, 30, 66, 0.15);
            border: 1px solid var(--neon-red);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="drawer-mask" class="drawer-mask" onclick="closeDrawer()"></div>
    <aside id="side-drawer" class="drawer">
        <div class="drawer-top">
            <span class="logo-title" style="font-size: 15px;">GHOSTCORE</span>
            <button type="button" class="drawer-close" onclick="closeDrawer()">✕</button>
        </div>

        <div class="drawer-cap">Личный кабинет</div>
        <button type="button" id="nav-profile" class="drawer-btn active" onclick="openSection('profile'); closeDrawer();">👤 Профиль и ключ</button>

        <div class="drawer-cap">Функции</div>
        <button type="button" id="nav-spammer" class="drawer-btn" onclick="openSection('spammer'); closeDrawer();">🚀 Спамер</button>
        <button type="button" id="nav-inviter" class="drawer-btn" onclick="openSection('inviter'); closeDrawer();">👥 Инвайтер</button>
        <button type="button" id="nav-parser" class="drawer-btn" onclick="openSection('parser'); closeDrawer();">🔍 Парсер</button>
        <button type="button" id="nav-accounts" class="drawer-btn" onclick="openSection('accounts'); closeDrawer();">📱 Telegram аккаунты</button>

        <div class="drawer-cap">Навигация</div>
        <a href="/" class="drawer-btn">💬 Главная и чат</a>
        <a href="/admin" class="drawer-btn">⚙️ Админ-панель</a>
        <a href="/logout-client" class="drawer-btn">🚪 Выйти</a>
    </aside>

    <div class="shell">
        <header class="nav-bar">
            <div class="nav-left">
                <button type="button" class="burger-btn" aria-label="Меню" onclick="openDrawer()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="logo-title" id="section-header-title">КАБИНЕТ</div>
            </div>
            <a href="/logout-client" class="exit-link">Выйти</a>
        </header>

        <div id="status-toast" class="toast"></div>

        <section id="sec-profile" class="frame-card">
            <div class="frame-title">ВАШ КЛЮЧ ДОСТУПА</div>
            <div class="key-row">
                <span id="profile-key" class="key-val">...</span>
                <button type="button" class="copy-btn" onclick="copyProfileKey()">Копировать</button>
            </div>

            <div class="stats-row">
                <div class="stat-box">
                    <div id="stat-accs" class="stat-num">0</div>
                    <div class="stat-cap">TG-аккаунтов</div>
                </div>
                <div class="stat-box">
                    <div id="stat-tasks" class="stat-num">0</div>
                    <div class="stat-cap">Задач запущено</div>
                </div>
            </div>

            <form action="/cabinet/update-profile" method="POST" style="margin-top: 14px;">
                <div class="frame-title" style="margin-bottom: 6px;">НАСТРОЙКИ ПРОФИЛЯ</div>

                <label class="field-label">ИМЯ / НИКНЕЙМ:</label>
                <input type="text" id="inp-client-name" name="client_name" class="field-box" placeholder="Введите имя" maxlength="40">

                <label class="field-label">СТАТУС / ПОДПИСЬ:</label>
                <input type="text" id="inp-status-text" name="status_text" class="field-box" placeholder="Например: Работаю в сети..." maxlength="80">

                <button type="submit" class="btn-red">СОХРАНИТЬ ПРОФИЛЬ</button>
            </form>
        </section>

        <section id="sec-accounts" class="frame-card" style="display: none;">
            <div class="frame-title">TELEGRAM АККАУНТЫ</div>
            <form action="/cabinet/add-account" method="POST">
                <input type="text" name="phone" class="field-box" placeholder="+380..." required>
                <button type="submit" class="btn-red">ЗАПРОСИТЬ SMS КОД</button>
            </form>
            <div class="or-divider">ИЛИ АВТОРИЗАЦИЯ</div>
            <a href="/cabinet/start-qr" class="btn-green">ВХОД ПО QR-КОДУ</a>
        </section>

        <section id="sec-tool" class="frame-card" style="display: none;">
            <form action="/cabinet/run-task" method="POST">
                <input type="hidden" id="task_type" name="task_type" value="spammer">
                <input type="hidden" id="target_type" name="target_type" value="chats">
                <input type="hidden" id="spam_mode" name="spam_mode" value="text">

                <div id="block-spammer">
                    <div class="frame-title">НАСТРОЙКИ СПАМЕРА</div>

                    <label class="field-label">БАЗА ЦЕЛЕЙ (ЧАТЫ ИЛИ ЛЮДИ ЧЕРЕЗ СТРОКУ):</label>
                    <textarea name="spam_targets" class="area-box" placeholder="https://t.me/chat_target"></textarea>

                    <label class="field-label">ТИП ЦЕЛИ:</label>
                    <div class="mode-grid">
                        <button type="button" id="tt-chats" class="mode-btn active" onclick="setTargetType('chats')">💬 ЧАТЫ / КАНАЛЫ</button>
                        <button type="button" id="tt-users" class="mode-btn" onclick="setTargetType('users')">👤 ЛЮДИ (ЛС/ТЕЛЕФОНЫ)</button>
                    </div>

                    <label class="field-label">РЕЖИМ ОТПРАВКИ:</label>
                    <div class="mode-grid">
                        <button type="button" id="sm-text" class="mode-btn active" onclick="setSpamMode('text')">📝 ТЕКСТ</button>
                        <button type="button" id="sm-forward" class="mode-btn" onclick="setSpamMode('forward')">🔁 РЕПОСТ ПО ССЫЛКЕ</button>
                    </div>

                    <div id="spam-text-box">
                        <label class="field-label">ТЕКСТ СООБЩЕНИЯ:</label>
                        <textarea name="spam_texts[]" class="area-box" placeholder="Текст рассылки..."></textarea>
                    </div>

                    <div id="spam-forward-box" style="display: none;">
                        <label class="field-label">ССЫЛКА НА ПОСТ ДЛЯ РЕПОСТА:</label>
                        <input type="text" name="spam_links[]" class="field-box" placeholder="https://t.me/channel/123">
                    </div>

                    <label class="field-label">ПОРЯДОК РАССЫЛКИ:</label>
                    <select name="spam_order" class="select-box">
                        <option value="sequential">Поочередно</option>
                        <option value="random">Случайно</option>
                    </select>

                    <div class="two-cols">
                        <div>
                            <label class="field-label">ЗАДЕРЖКА (СЕК):</label>
                            <input type="number" name="spam_delay" class="field-box" value="5" min="1">
                        </div>
                        <div>
                            <label class="field-label">ЛИМИТ НА АКК:</label>
                            <input type="number" name="spam_limit" class="field-box" value="20" min="1">
                        </div>
                    </div>
                </div>

                <div id="block-inviter" style="display: none;">
                    <div class="frame-title">НАСТРОЙКИ ИНВАЙТЕРА</div>

                    <label class="field-label">ЦЕЛЕВОЙ ЧАТ ДЛЯ ИНВАЙТА:</label>
                    <input type="text" name="inviter_target" class="field-box" placeholder="https://t.me/your_chat">

                    <label class="field-label">ЧАТЫ-ДОНОРЫ (ЧЕРЕЗ СТРОКУ):</label>
                    <textarea name="inviter_sources" class="area-box" placeholder="https://t.me/source_chat"></textarea>

                    <label class="field-label">ПРЯМЫЙ СПИСОК ЮЗЕРНЕЙМОВ (ОПЦИОНАЛЬНО):</label>
                    <textarea name="inviter_direct_users" class="area-box" placeholder="@username"></textarea>

                    <div class="two-cols">
                        <div>
                            <label class="field-label">МИН. ЗАДЕРЖКА:</label>
                            <input type="number" name="inviter_delay_min" class="field-box" value="10" min="1">
                        </div>
                        <div>
                            <label class="field-label">МАКС. ЗАДЕРЖКА:</label>
                            <input type="number" name="inviter_delay_max" class="field-box" value="20" min="1">
                        </div>
                    </div>

                    <label class="field-label">ЛИМИТ НА АККАУНТ:</label>
                    <input type="number" name="inviter_limit" class="field-box" value="10" min="1">
                </div>

                <div id="block-parser" style="display: none;">
                    <div class="frame-title">НАСТРОЙКИ ПАРСЕРА</div>

                    <label class="field-label">ЧАТЫ ДЛЯ ПАРСИНГА (ЧЕРЕЗ СТРОКУ):</label>
                    <textarea name="parser_targets" class="area-box" placeholder="https://t.me/target_chat"></textarea>

                    <label class="field-label">РЕЖИМ ПАРСИНГА:</label>
                    <select name="parser_mode" class="select-box">
                        <option value="active">Активные участники</option>
                        <option value="all">Все участники</option>
                    </select>

                    <label class="field-label">ЛИМИТ ПОЛЬЗОВАТЕЛЕЙ:</label>
                    <input type="number" name="parser_limit" class="field-box" value="500" min="1">
                </div>

                <button type="submit" class="btn-red" style="margin-top: 14px;">ЗАПУСТИТЬ ЗАДАЧУ</button>
            </form>
        </section>
    </div>

    <script>
        const drawer = document.getElementById("side-drawer");
        const mask = document.getElementById("drawer-mask");

        const titles = {
            profile: "КАБИНЕТ",
            spammer: "СПАМЕР",
            inviter: "ИНВАЙТЕР",
            parser: "ПАРСЕР",
            accounts: "АККАУНТЫ"
        };

        function openDrawer() {
            drawer.classList.add("open");
            mask.classList.add("open");
        }
        function closeDrawer() {
            drawer.classList.remove("open");
            mask.classList.remove("open");
        }

        function openSection(section) {
            ["profile", "spammer", "inviter", "parser", "accounts"].forEach(id => {
                const navBtn = document.getElementById("nav-" + id);
                if (navBtn) navBtn.classList.toggle("active", id === section);
            });

            document.getElementById("section-header-title").textContent = titles[section] || "КАБИНЕТ";

            document.getElementById("sec-profile").style.display = (section === "profile") ? "block" : "none";
            document.getElementById("sec-accounts").style.display = (section === "accounts") ? "block" : "none";
            document.getElementById("sec-tool").style.display = (["spammer", "inviter", "parser"].includes(section)) ? "block" : "none";

            if (["spammer", "inviter", "parser"].includes(section)) {
                document.getElementById("task_type").value = section;
                ["spammer", "inviter", "parser"].forEach(tool => {
                    document.getElementById("block-" + tool).style.display = (tool === section) ? "block" : "none";
                });
            }
        }

        function setTargetType(val) {
            document.getElementById("target_type").value = val;
            document.getElementById("tt-chats").classList.toggle("active", val === "chats");
            document.getElementById("tt-users").classList.toggle("active", val === "users");
        }

        function setSpamMode(val) {
            document.getElementById("spam_mode").value = val;
            document.getElementById("sm-text").classList.toggle("active", val === "text");
            document.getElementById("sm-forward").classList.toggle("active", val === "forward");
            document.getElementById("spam-text-box").style.display = (val === "text") ? "block" : "none";
            document.getElementById("spam-forward-box").style.display = (val === "forward") ? "block" : "none";
        }

        function copyProfileKey() {
            const keyText = document.getElementById("profile-key").textContent.trim();
            if (navigator.clipboard && keyText && keyText !== "...") {
                navigator.clipboard.writeText(keyText).catch(() => {});
            }
        }

        async function loadProfile() {
            try {
                const res = await fetch("/api/profile");
                if (!res.ok) return;
                const data = await res.json();
                if (!data.authenticated || !data.profile) return;

                const p = data.profile;
                document.getElementById("profile-key").textContent = p.key_code || "";
                document.getElementById("inp-client-name").value = p.client_name || "";
                document.getElementById("inp-status-text").value = p.status_text || "";
                document.getElementById("stat-accs").textContent = String(p.tg_accounts_count ?? 0);
                document.getElementById("stat-tasks").textContent = String(p.tasks_count ?? 0);
            } catch (e) {
                console.error(e);
            }
        }

        const params = new URLSearchParams(window.location.search);
        const msg = params.get("message");
        if (msg) {
            const toast = document.getElementById("status-toast");
            toast.textContent = msg;
            toast.style.display = "block";
        }

        if (window.location.hash === "#inviter") openSection("inviter");
        else if (window.location.hash === "#parser") openSection("parser");
        else if (window.location.hash === "#spammer") openSection("spammer");
        else if (window.location.hash === "#accounts") openSection("accounts");
        else openSection("profile");

        loadProfile();
    </script>
</body>
</html>
